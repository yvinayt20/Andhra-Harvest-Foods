<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <!-- Wheat stalk icon -->
  <g transform="translate(200,200)" opacity="0.3">
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#1B4332" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-40" rx="10" ry="18" fill="#1B4332" transform="rotate(-30 -12 -40)"/>
    <ellipse cx="12" cy="-20" rx="10" ry="18" fill="#1B4332" transform="rotate(30 12 -20)"/>
    <ellipse cx="-12" cy="0" rx="10" ry="18" fill="#1B4332" transform="rotate(-30 -12 0)"/>
    <ellipse cx="12" cy="20" rx="10" ry="18" fill="#1B4332" transform="rotate(30 12 20)"/>
  </g>
  <text x="200" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1B4332" opacity="0.5">Andhra Harvest Foods</text>
</svg>
